# Tiny Tapeout project information (yaml_version 6, from ttsky-verilog-template)
project:
  title:        "Accelerometer Interface (H3LIS331DL)"
  author:       "Sai Kumar Poludasu"
  discord:      ""
  description:  "SPI master for an H3LIS331DL accelerometer, CIC decimator, FIFO and SPI slave host port"
  language:     "Verilog"
  clock_hz:     10000000

  # Estimate from generic synthesis (983 flip-flops). Confirm with the GDS
  # hardening run before submitting; 1x2 may fit with an 4-deep FIFO.
  tiles: "2x2"

  top_module:  "tt_um_saikumarpv2643_accel_if"

  source_files:
    - "project.v"
    - "spi_master.v"
    - "sensor_ctrl.v"
    - "cic_decim.v"
    - "sync_fifo.v"
    - "host_if.v"

pinout:
  # Inputs
  ui[0]: "SENS_MISO"
  ui[1]: "SENS_DRDY"
  ui[2]: "HOST_SCK"
  ui[3]: "HOST_MOSI"
  ui[4]: "HOST_CS_N"
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "SENS_SCK"
  uo[1]: "SENS_MOSI"
  uo[2]: "SENS_CS_N"
  uo[3]: "HOST_MISO"
  uo[4]: "IRQ"
  uo[5]: "SENSOR_OK"
  uo[6]: "OVERFLOW"
  uo[7]: "RUNNING"

  # Bidirectional pins
  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
